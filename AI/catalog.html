<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sales Reference Catalog</title>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3/lib/msal-browser.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.46.0/tabler-icons.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="gate" id="gate">
  <div class="gate-card">
    <h1>Sales Reference Catalog</h1>
    <p>Sign in with your work account to view the catalog.</p>
    <button class="gate-btn" id="signInBtn">Sign in with Microsoft</button>
    <div class="gate-error" id="gateError"></div>
  </div>
</div>

<div class="shell" id="shell">

  <div class="topbar">
    <div class="brand-inline">Sales Reference Catalog</div>
    <div class="tabs" id="sectionTabs"></div>
    <div class="signout" id="signOutBtn">Sign out</div>
  </div>

  <div class="status-banner" id="statusBanner"></div>
  <div class="loading-banner" id="loadingBanner" style="display:none;">Loading catalog…</div>

  <div class="stats-strip" id="statsStrip"></div>

  <!-- Browse view: left panel / accordion / right panel -->
  <div class="browse-view" id="browseView">
    <nav class="panel panel-left" id="panelSub1"></nav>
    <main class="accordion-main" id="accordionMain"></main>
    <nav class="panel panel-right" id="panelSub2"></nav>
  </div>

  <!-- Search view: flat search + advanced filters + grid -->
  <div class="search-view" id="searchView" style="display:none;">
    <div class="search-row">
      <div class="search-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#337077" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="Search by name, section, or subsection…">
      </div>
      <button class="btn-advanced" id="advancedToggle">Advanced search</button>
    </div>

    <div class="advanced-panel" id="advancedPanel">
      <div class="filter-group">
        <label>Section</label>
        <select id="filterSection"><option value="">All sections</option></select>
      </div>
      <div class="filter-group">
        <label>File type</label>
        <select id="filterType"><option value="">All types</option></select>
      </div>
      <div class="filter-group">
        <label>Subsection contains</label>
        <input type="text" id="filterSubsection" placeholder="e.g. Battlecards">
      </div>
      <div class="filter-group">
        <label>Tags</label>
        <input type="text" id="filterTags" placeholder="e.g. AWS">
      </div>
      <div class="filter-group">
        <label>Description contains</label>
        <input type="text" id="filterDescription" placeholder="e.g. onboarding">
      </div>
      <button class="filter-clear" id="clearFilters">Clear all</button>
    </div>

    <div class="result-meta" id="resultMeta"></div>
    <div id="searchResults"></div>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
