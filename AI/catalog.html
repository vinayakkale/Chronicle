<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sales Reference Catalog</title>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3/lib/msal-browser.min.js"></script>
<style>
  :root {
    --carbon: #0C2226;
    --quantum: #194247;
    --ocean: #337077;
    --mint: #D2F0C6;
    --pulse: #52E081;
    --white: #FFFFFF;
    --hairline: #E2E8E7;
    --bg-panel: #F7FAF9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--carbon);
    background: var(--white);
  }
  a { color: inherit; text-decoration: none; }

  /* ---- Sign-in gate ---- */
  .gate {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--carbon);
  }
  .gate-card {
    background: var(--white);
    border-radius: 10px;
    padding: 44px 40px;
    width: 360px;
    text-align: left;
  }
  .gate-card h1 { font-size: 20px; margin: 0 0 6px 0; }
  .gate-card p { font-size: 14px; color: var(--quantum); margin: 0 0 22px 0; }
  .gate-btn {
    background: var(--pulse);
    color: var(--carbon);
    border: none;
    border-radius: 6px;
    padding: 12px 20px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
  }
  .gate-btn:hover { opacity: 0.9; }
  .gate-error { color: #a4262c; font-size: 13px; margin-top: 14px; display: none; }

  /* ---- Layout shell ---- */
  .shell { display: none; min-height: 100vh; }
  .shell.show { display: flex; }

  .sidebar {
    width: 240px;
    flex-shrink: 0;
    background: var(--carbon);
    color: var(--white);
    padding: 28px 0;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }
  .brand {
    padding: 0 24px 24px 24px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.2px;
    border-bottom: 1px solid rgba(255,255,255,0.12);
    margin-bottom: 12px;
  }
  .brand .sub { display: block; font-weight: 400; font-size: 12px; color: var(--mint); margin-top: 2px; }

  .nav-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 11px 24px;
    font-size: 14px;
    cursor: pointer;
    border-left: 3px solid transparent;
    color: rgba(255,255,255,0.82);
  }
  .nav-item:hover { background: rgba(255,255,255,0.06); }
  .nav-item.active {
    background: rgba(82,224,129,0.10);
    border-left-color: var(--pulse);
    color: var(--white);
    font-weight: 600;
  }
  .nav-count { font-size: 12px; color: rgba(255,255,255,0.5); }
  .nav-item.active .nav-count { color: var(--mint); }

  .signout {
    margin: 20px 24px 0 24px;
    font-size: 12px;
    color: rgba(255,255,255,0.55);
    cursor: pointer;
  }
  .signout:hover { color: var(--white); }

  .main { flex: 1; padding: 32px 40px 60px 40px; min-width: 0; }

  h1 { font-size: 26px; font-weight: 600; margin: 0 0 4px 0; text-align: left; }
  .page-sub { color: var(--ocean); font-size: 14px; margin-bottom: 24px; }

  .search-row { display: flex; gap: 10px; margin-bottom: 14px; }
  .search-box {
    flex: 1; display: flex; align-items: center;
    border: 1.5px solid var(--hairline); border-radius: 6px;
    padding: 10px 14px; background: var(--white);
  }
  .search-box:focus-within { border-color: var(--pulse); }
  .search-box svg { flex-shrink: 0; margin-right: 10px; }
  .search-box input { border: none; outline: none; width: 100%; font-size: 15px; font-family: inherit; color: var(--carbon); }
  .btn-advanced {
    border: 1.5px solid var(--ocean); background: var(--white); color: var(--ocean);
    border-radius: 6px; padding: 0 18px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .btn-advanced.open { background: var(--ocean); color: var(--white); }

  .advanced-panel {
    display: none; background: var(--bg-panel); border: 1px solid var(--hairline);
    border-radius: 8px; padding: 18px 20px; margin-bottom: 20px; gap: 20px; flex-wrap: wrap;
  }
  .advanced-panel.open { display: flex; }
  .filter-group { min-width: 180px; }
  .filter-group label { display: block; font-size: 12px; font-weight: 600; color: var(--quantum); margin-bottom: 6px; }
  .filter-group select, .filter-group input {
    width: 100%; padding: 8px 10px; border: 1px solid var(--hairline);
    border-radius: 5px; font-size: 13px; font-family: inherit; background: var(--white);
  }
  .filter-clear { align-self: flex-end; background: none; border: none; color: var(--ocean); font-size: 13px; font-weight: 600; cursor: pointer; padding: 8px 4px; }

  .result-meta { font-size: 13px; color: var(--quantum); margin-bottom: 18px; }
  .result-meta b { color: var(--carbon); }

  .subsection-group { margin-bottom: 32px; }
  .subsection-title {
    font-size: 13px; font-weight: 700; color: var(--ocean); text-transform: uppercase;
    letter-spacing: 0.4px; padding-bottom: 8px; border-bottom: 1px solid var(--hairline); margin-bottom: 14px;
  }
  .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .card {
    display: flex; gap: 12px; padding: 14px; border: 1px solid var(--hairline);
    border-radius: 8px; background: var(--white); transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .card:hover { border-color: var(--ocean); box-shadow: 0 2px 10px rgba(12,34,38,0.08); }
  .card-icon {
    width: 38px; height: 38px; flex-shrink: 0; border-radius: 6px;
    display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: var(--white);
  }
  .card-body { min-width: 0; }
  .card-title {
    font-size: 14px; font-weight: 600; color: var(--carbon); margin-bottom: 3px;
    overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .card-type { font-size: 11.5px; color: var(--ocean); text-transform: uppercase; letter-spacing: 0.3px; }

  .empty-state { text-align: left; padding: 60px 20px; color: var(--quantum); }
  .empty-state .big { font-size: 16px; font-weight: 600; color: var(--carbon); margin-bottom: 6px; }

  .status-banner { display: none; background: #fde7e9; color: #a4262c; padding: 10px 14px; border-radius: 6px; font-size: 13px; margin-bottom: 18px; }
  .status-banner.show { display: block; }
  .loading-banner { padding: 10px 14px; font-size: 13px; color: var(--quantum); }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--hairline); border-radius: 8px; }

  @media (max-width: 800px) {
    .sidebar { display: none; }
    .main { padding: 20px; }
  }
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="gate-card">
    <h1>Sales Reference Catalog</h1>
    <p>Sign in with your work account to view the catalog.</p>
    <button class="gate-btn" id="signInBtn">Sign in with Microsoft</button>
    <div class="gate-error" id="gateError"></div>
  </div>
</div>

<div class="shell" id="shell">
  <nav class="sidebar" id="sidebar">
    <div class="brand">Sales Reference Catalog<span class="sub">Presales Publications</span></div>
    <div id="navList"></div>
    <div class="signout" id="signOutBtn">Sign out</div>
  </nav>

  <main class="main">
    <h1 id="sectionHeading">All Sections</h1>
    <div class="page-sub" id="sectionSub">Every reference asset in one place</div>

    <div class="status-banner" id="statusBanner"></div>
    <div class="loading-banner" id="loadingBanner" style="display:none;">Loading catalog…</div>

    <div class="search-row">
      <div class="search-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#337077" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="Search by name, section, or subsection…">
      </div>
      <button class="btn-advanced" id="advancedToggle">Advanced search</button>
    </div>

    <div class="advanced-panel" id="advancedPanel">
      <div class="filter-group">
        <label>Section</label>
        <select id="filterSection"><option value="">All sections</option></select>
      </div>
      <div class="filter-group">
        <label>File type</label>
        <select id="filterType"><option value="">All types</option></select>
      </div>
      <div class="filter-group">
        <label>Subsection contains</label>
        <input type="text" id="filterSubsection" placeholder="e.g. Battlecards">
      </div>
      <div class="filter-group">
        <label>Tags</label>
        <input type="text" id="filterTags" placeholder="e.g. AWS">
      </div>
      <button class="filter-clear" id="clearFilters">Clear all</button>
    </div>

    <div class="result-meta" id="resultMeta"></div>
    <div id="results"></div>
  </main>
</div>

<script>
/* =========================================================
   CONFIG
   ========================================================= */
const CONFIG = {
  clientId: "c4556a8a-fa5e-4783-97d0-65519d6abe5d",
  tenantId: "7aa4356e-1227-4975-bb58-165bff68ff0a",
  siteId: "64d8a919-0f19-49da-b57f-7c4c91508ae3,b405a983-d1e6-49bc-a2f9-7664aefa5c2c",
  listId: "352b483d-47f9-4726-9afb-1b40008e6204",
  columns: {
    title: "Title",
    section: "Section",
    subsection: "Subsection",
    fileExtension: "FileExtension",
    linkUrl: "LinkURL",
    tags: "Tags"
  }
};
/* ========================================================= */

const GRAPH_SCOPES = ["Sites.Read.All"];

const msalConfig = {
  auth: {
    clientId: CONFIG.clientId,
    authority: `https://login.microsoftonline.com/${CONFIG.tenantId}`,
    redirectUri: window.location.origin + window.location.pathname
  },
  cache: { cacheLocation: "sessionStorage" }
};
const msalInstance = new msal.PublicClientApplication(msalConfig);

let msalReady = false;
async function ensureMsalReady() {
  if (!msalReady) {
    await msalInstance.initialize();
    msalReady = true;
  }
}

const ICON_MAP = {
  pptx: { label: "PPT", color: "#C0392B" },
  docx: { label: "DOC", color: "#194247" },
  xlsx: { label: "XLS", color: "#1E7A46" },
  pdf:  { label: "PDF", color: "#0C2226" },
  mp4:  { label: "VID", color: "#337077" },
  url:  { label: "LNK", color: "#52E081" },
  link: { label: "LNK", color: "#52E081" }
};

let allItems = [];
let activeSection = "";

/* ---- Auth ---- */
async function signIn() {
  try {
    await ensureMsalReady();
    const resp = await msalInstance.loginPopup({ scopes: GRAPH_SCOPES });
    msalInstance.setActiveAccount(resp.account);
    await afterSignIn();
  } catch (err) {
    showGateError("Sign-in failed: " + err.message);
  }
}

async function afterSignIn() {
  document.getElementById("gate").style.display = "none";
  document.getElementById("shell").classList.add("show");
  await loadItems();
}

function showGateError(msg) {
  const el = document.getElementById("gateError");
  el.textContent = msg;
  el.style.display = "block";
}

async function getToken() {
  await ensureMsalReady();
  const account = msalInstance.getActiveAccount() || msalInstance.getAllAccounts()[0];
  if (!account) throw new Error("Not signed in");
  try {
    const result = await msalInstance.acquireTokenSilent({ scopes: GRAPH_SCOPES, account });
    return result.accessToken;
  } catch (e) {
    const result = await msalInstance.acquireTokenPopup({ scopes: GRAPH_SCOPES });
    return result.accessToken;
  }
}

document.getElementById("signInBtn").addEventListener("click", signIn);
document.getElementById("signOutBtn").addEventListener("click", async () => {
  await ensureMsalReady();
  msalInstance.logoutRedirect();
});

/* ---- Data loading (Microsoft Graph) ---- */
async function loadItems() {
  const banner = document.getElementById("loadingBanner");
  banner.style.display = "block";
  try {
    const token = await getToken();
    const c = CONFIG.columns;
    let url = `https://graph.microsoft.com/v1.0/sites/${CONFIG.siteId}/lists/${CONFIG.listId}/items?expand=fields&$top=200`;
    let results = [];

    while (url) {
      const res = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      results = results.concat(data.value || []);
      url = data["@odata.nextLink"] || null;
    }

    allItems = results.map(item => {
      const f = item.fields || {};
      const rawLink = f[c.linkUrl];
      const link = (rawLink && typeof rawLink === "object") ? rawLink.Url : rawLink;
      return {
        id: item.id,
        title: f[c.title] || "Untitled",
        section: f[c.section] || "Uncategorized",
        subsection: f[c.subsection] || "",
        ext: (f[c.fileExtension] || "link").toLowerCase(),
        url: link || "#",
        tags: f[c.tags] || ""
      };
    });

    banner.style.display = "none";
    buildNav();
    populateFilterOptions();
    render();
  } catch (err) {
    banner.style.display = "none";
    showError(`Could not load the catalog from Microsoft Graph. (${err.message})`);
  }
}

function showError(msg) {
  const b = document.getElementById("statusBanner");
  b.textContent = msg;
  b.classList.add("show");
}

/* ---- Nav ---- */
function buildNav() {
  const sections = [...new Set(allItems.map(i => i.section))].sort();
  const navList = document.getElementById("navList");
  const allCount = allItems.length;

  let html = `<div class="nav-item active" data-section="">
      <span>All items</span><span class="nav-count">${allCount}</span>
    </div>`;

  sections.forEach(s => {
    const count = allItems.filter(i => i.section === s).length;
    html += `<div class="nav-item" data-section="${escapeAttr(s)}">
        <span>${escapeHtml(s)}</span><span class="nav-count">${count}</span>
      </div>`;
  });
  navList.innerHTML = html;

  navList.querySelectorAll(".nav-item").forEach(el => {
    el.addEventListener("click", () => {
      activeSection = el.dataset.section;
      navList.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));
      el.classList.add("active");
      document.getElementById("filterSection").value = activeSection;
      document.getElementById("sectionHeading").textContent = activeSection || "All Sections";
      render();
    });
  });
}

function populateFilterOptions() {
  const sections = [...new Set(allItems.map(i => i.section))].sort();
  const types = [...new Set(allItems.map(i => i.ext))].sort();

  const secSel = document.getElementById("filterSection");
  sections.forEach(s => secSel.insertAdjacentHTML("beforeend", `<option value="${escapeAttr(s)}">${escapeHtml(s)}</option>`));

  const typeSel = document.getElementById("filterType");
  types.forEach(t => typeSel.insertAdjacentHTML("beforeend", `<option value="${t}">${t.toUpperCase()}</option>`));
}

/* ---- Search / filter / render ---- */
function currentFilters() {
  return {
    q: document.getElementById("searchInput").value.trim().toLowerCase(),
    section: document.getElementById("filterSection").value,
    type: document.getElementById("filterType").value,
    subsection: document.getElementById("filterSubsection").value.trim().toLowerCase(),
    tags: document.getElementById("filterTags").value.trim().toLowerCase()
  };
}

function render() {
  const f = currentFilters();
  let items = allItems.filter(i => {
    if (f.section && i.section !== f.section) return false;
    if (f.type && i.ext !== f.type) return false;
    if (f.subsection && !i.subsection.toLowerCase().includes(f.subsection)) return false;
    if (f.tags && !i.tags.toLowerCase().includes(f.tags)) return false;
    if (f.q) {
      const hay = `${i.title} ${i.section} ${i.subsection} ${i.tags}`.toLowerCase();
      if (!hay.includes(f.q)) return false;
    }
    return true;
  });

  document.getElementById("resultMeta").innerHTML =
    `Showing <b>${items.length}</b> of <b>${allItems.length}</b> items`;

  const container = document.getElementById("results");
  if (items.length === 0) {
    container.innerHTML = `<div class="empty-state">
        <div class="big">No matches</div>
        Try a different keyword or clear your filters.
      </div>`;
    return;
  }

  const groups = {};
  items.forEach(i => {
    const key = i.subsection || "General";
    const groupKey = (f.section ? "" : i.section + " — ") + key;
    if (!groups[groupKey]) groups[groupKey] = [];
    groups[groupKey].push(i);
  });

  let html = "";
  Object.keys(groups).sort().forEach(groupName => {
    html += `<div class="subsection-group">
        <div class="subsection-title">${escapeHtml(groupName)}</div>
        <div class="card-grid">`;
    groups[groupName].forEach(i => {
      const icon = ICON_MAP[i.ext] || { label: i.ext.slice(0,3).toUpperCase(), color: "#337077" };
      html += `<a class="card" href="${escapeAttr(i.url)}" target="_blank" rel="noopener">
          <div class="card-icon" style="background:${icon.color}">${icon.label}</div>
          <div class="card-body">
            <div class="card-title">${escapeHtml(i.title)}</div>
            <div class="card-type">${i.ext}</div>
          </div>
        </a>`;
    });
    html += `</div></div>`;
  });
  container.innerHTML = html;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));
}
function escapeAttr(s) { return escapeHtml(s); }

document.getElementById("searchInput").addEventListener("input", render);
document.getElementById("filterSection").addEventListener("change", render);
document.getElementById("filterType").addEventListener("change", render);
document.getElementById("filterSubsection").addEventListener("input", render);
document.getElementById("filterTags").addEventListener("input", render);

document.getElementById("advancedToggle").addEventListener("click", (e) => {
  const panel = document.getElementById("advancedPanel");
  panel.classList.toggle("open");
  e.target.classList.toggle("open");
});

document.getElementById("clearFilters").addEventListener("click", () => {
  document.getElementById("filterSection").value = "";
  document.getElementById("filterType").value = "";
  document.getElementById("filterSubsection").value = "";
  document.getElementById("filterTags").value = "";
  document.getElementById("searchInput").value = "";
  activeSection = "";
  document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));
  document.querySelector('.nav-item[data-section=""]').classList.add("active");
  document.getElementById("sectionHeading").textContent = "All Sections";
  render();
});

/* ---- On load: try silent SSO first ---- */
(async function init() {
  try {
    await ensureMsalReady();
    await msalInstance.handleRedirectPromise();
    const account = msalInstance.getAllAccounts()[0];
    if (account) {
      msalInstance.setActiveAccount(account);
      await afterSignIn();
    }
  } catch (err) {
    showGateError("Session check failed: " + err.message);
  }
})();
</script>
</body>
</html>
